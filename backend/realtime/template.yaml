AWSTemplateFormatVersion: '2010-09-09'
Description: Lifesafe real-time messaging resources

Parameters:
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  UserProfilesTableName:
    Type: String
    Default: LifesafeUserProfiles
  UserSearchTableName:
    Type: String
    Default: LifesafeUserSearch
  FriendshipsTableName:
    Type: String
    Default: LifesafeFriendships
  MessagesTableName:
    Type: String
    Default: LifesafeMessages
  ConnectionsTableName:
    Type: String
    Default: LifesafeWebSocketConnections

Resources:
  RealtimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RealtimeData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FriendshipsTableName}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MessagesTableName}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConnectionsTableName}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConnectionsTableName}/index/UserConnectionsIndex'

  RealtimeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: handlers.send_message
      Role: !GetAtt RealtimeRole.Arn
      Timeout: 15
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          FRIENDSHIPS_TABLE_NAME: !Ref FriendshipsTableName
          MESSAGES_TABLE_NAME: !Ref MessagesTableName
          CONNECTIONS_TABLE_NAME: !Ref ConnectionsTableName

  ConnectFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: handlers.connect
      Role: !GetAtt RealtimeRole.Arn
      Timeout: 15
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          FRIENDSHIPS_TABLE_NAME: !Ref FriendshipsTableName
          MESSAGES_TABLE_NAME: !Ref MessagesTableName
          CONNECTIONS_TABLE_NAME: !Ref ConnectionsTableName

  DisconnectFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: handlers.disconnect
      Role: !GetAtt RealtimeRole.Arn
      Timeout: 15
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          FRIENDSHIPS_TABLE_NAME: !Ref FriendshipsTableName
          MESSAGES_TABLE_NAME: !Ref MessagesTableName
          CONNECTIONS_TABLE_NAME: !Ref ConnectionsTableName

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: LifesafeRealtime
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations'

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations'

  SendMessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RealtimeFunction.Arn}/invocations'

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Join ['/', ['integrations', !Ref ConnectIntegration]]

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Join ['/', ['integrations', !Ref DisconnectIntegration]]

  SendMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: sendMessage
      AuthorizationType: NONE
      Target: !Join ['/', ['integrations', !Ref SendMessageIntegration]]

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true

  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectFunction
      Principal: apigateway.amazonaws.com

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DisconnectFunction
      Principal: apigateway.amazonaws.com

  SendMessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RealtimeFunction
      Principal: apigateway.amazonaws.com

  ManageConnectionsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ManageWebSocketConnections
      Roles: [!Ref RealtimeRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: execute-api:ManageConnections
            Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

Outputs:
  WebSocketUrl:
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  UserProfilesTableName:
    Value: !Ref UserProfilesTableName
  UserSearchTableName:
    Value: !Ref UserSearchTableName
  FriendshipsTableName:
    Value: !Ref FriendshipsTableName
  MessagesTableName:
    Value: !Ref MessagesTableName
  ConnectionsTableName:
    Value: !Ref ConnectionsTableName
